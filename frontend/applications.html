<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Applications | PlacementPro</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .page {
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            max-width: 1100px;
            margin: 0 auto 30px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #2563eb;
        }

        .back-btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;

            background: #111827;
            color: white;

            cursor: pointer;
            font-weight: 600;
        }

        .title-section {
            max-width: 1100px;
            margin: 0 auto 25px;
        }

        .title-section h1 {
            margin-bottom: 8px;
        }

        .title-section p {
            color: #6b7280;
        }

        .applications-container {
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .application-card {
            background: white;
            padding: 25px;
            border-radius: 16px;

            box-shadow:
                0 5px 20px
                rgba(0, 0, 0, 0.06);
        }

        .company-name {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .job-role {
            color: #2563eb;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .status {
            display: inline-block;

            padding: 6px 12px;

            border-radius: 20px;

            background: #dcfce7;
            color: #166534;

            font-size: 14px;
            font-weight: 700;
        }

        .application-info {
            margin-top: 18px;
            color: #6b7280;
            line-height: 1.8;
        }

        .loading,
        .empty,
        .error {
            grid-column: 1 / -1;

            background: white;

            padding: 40px;

            border-radius: 16px;

            text-align: center;
        }

        .loading {
            color: #2563eb;
        }

        .empty {
            color: #6b7280;
        }

        .error {
            color: #dc2626;
        }

        @media (max-width: 800px) {

            .applications-container {
                grid-template-columns: 1fr;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

<main class="page">


    <header class="header">

        <div class="brand">
            Placement<span>Pro</span>
        </div>

        <button
            class="back-btn"
            onclick="goDashboard()"
        >
            ← Dashboard
        </button>

    </header>


    <section class="title-section">

        <h1>
            📋 My Applications
        </h1>

        <p>
            Track the placement drives you have applied for.
        </p>

    </section>


    <section
        id="applicationsContainer"
        class="applications-container"
    >

        <div class="loading">
            Loading applications...
        </div>

    </section>


</main>


<script>

async function loadApplications() {

    const container =
        document.getElementById(
            "applicationsContainer"
        );


    const studentData =
        localStorage.getItem("student");


    if (!studentData) {

        window.location.href =
            "login.html";

        return;
    }


    const student =
        JSON.parse(studentData);


    try {

        const response =
            await fetch(
                "http://https://placementpro-khij.onrender.com/api/applications/"
                + encodeURIComponent(student.email)
            );


        if (!response.ok) {

            throw new Error(
                "Unable to load applications"
            );
        }


        const applications =
            await response.json();


        if (
            !applications ||
            applications.length === 0
        ) {

            container.innerHTML = `

                <div class="empty">

                    <h3>
                        No applications yet
                    </h3>

                    <p>
                        Apply for a placement drive
                        to see it here.
                    </p>

                </div>

            `;

            return;
        }


        container.innerHTML =
            applications.map(
                function(application) {

                    return `

                        <div class="application-card">

                            <div class="company-name">

                                ${escapeHTML(
                                    application.companyName
                                    || "Company"
                                )}

                            </div>


                            <div class="job-role">

                                ${escapeHTML(
                                    application.jobRole
                                    || "Job Role"
                                )}

                            </div>


                            <span class="status">

                                ${escapeHTML(
                                    application.status
                                    || "Applied"
                                )}

                            </span>


                            <div class="application-info">

                                Application ID:
                                ${application.id}

                                <br>

                                Drive ID:
                                ${application.driveId}

                            </div>

                        </div>

                    `;

                }
            ).join("");


    } catch (error) {

        console.error(
            error
        );

        container.innerHTML = `

            <div class="error">

                <h3>
                    Unable to load applications
                </h3>

                <p>
                    Make sure Spring Boot is running.
                </p>

            </div>

        `;

    }

}


function goDashboard() {

    window.location.href =
        "dashboard.html";

}


function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value;

    return div.innerHTML;

}


loadApplications();

</script>

</body>

</html>
