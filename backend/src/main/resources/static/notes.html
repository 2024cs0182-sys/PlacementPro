<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Notes | PlacementPro</title>


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        .page {
            min-height: 100vh;
            padding: 30px;
        }

        .header {
            max-width: 1100px;
            margin: 0 auto 25px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand {
            font-size: 26px;
            font-weight: 800;
        }

        .brand span {
            color: #2563eb;
        }

        .back-btn {
            text-decoration: none;
            color: #2563eb;
            font-weight: 700;
        }

        .intro {
            max-width: 1100px;
            margin: 0 auto 25px;

            background: white;
            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .intro h1 {
            margin: 0 0 8px;
        }

        .intro p {
            margin: 0;
            color: #6b7280;
        }

        .notes-layout {
            max-width: 1100px;
            margin: auto;

            display: grid;

            grid-template-columns: 350px 1fr;

            gap: 20px;
        }

        .card {
            background: white;

            padding: 25px;

            border-radius: 16px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .card h2 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;

            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-family: Arial, sans-serif;

            font-size: 14px;

            margin-bottom: 15px;
        }

        textarea {
            min-height: 180px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;

            border-color: #2563eb;
        }

        .save-btn {
            width: 100%;

            border: none;

            background: #2563eb;

            color: white;

            padding: 12px;

            border-radius: 8px;

            font-weight: 700;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .notes-list {
            display: flex;

            flex-direction: column;

            gap: 15px;
        }

        .note {
            border: 1px solid #e5e7eb;

            border-radius: 12px;

            padding: 18px;
        }

        .note h3 {
            margin: 0 0 8px;
        }

        .note p {
            color: #4b5563;

            white-space: pre-wrap;

            line-height: 1.6;

            margin-bottom: 15px;
        }

        .note-date {
            font-size: 12px;

            color: #9ca3af;

            margin-bottom: 12px;
        }

        .note-actions {
            display: flex;

            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;

            padding: 8px 14px;

            border-radius: 7px;

            cursor: pointer;

            font-weight: 600;
        }

        .edit-btn {
            background: #dbeafe;

            color: #1d4ed8;
        }

        .delete-btn {
            background: #fee2e2;

            color: #dc2626;
        }

        .empty {
            text-align: center;

            color: #6b7280;

            padding: 40px 20px;
        }

        .message {
            margin-top: 10px;

            font-size: 14px;

            font-weight: 600;
        }

        @media (max-width: 800px) {

            .notes-layout {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 500px) {

            .page {
                padding: 15px;
            }

            .header {
                flex-direction: column;

                align-items: flex-start;

                gap: 10px;
            }

        }

    </style>

</head>


<body>


<div class="page">


    <!-- HEADER -->

    <header class="header">

        <div class="brand">

            Placement<span>Pro</span>

        </div>


        <a
            href="dashboard.html"
            class="back-btn"
        >
            ← Dashboard
        </a>

    </header>



    <!-- INTRO -->

    <section class="intro">

        <h1>
            📝 My Notes
        </h1>

        <p>
            Save important Java, DSA, Aptitude and
            placement preparation notes.
        </p>

    </section>



    <!-- NOTES -->

    <section class="notes-layout">


        <!-- ADD NOTE -->

        <div class="card">

            <h2>
                Add Note
            </h2>


            <input
                type="text"
                id="noteTitle"
                placeholder="Note title"
            >


            <textarea
                id="noteContent"
                placeholder="Write your note here..."
            ></textarea>


            <button
                class="save-btn"
                onclick="saveNote()"
                id="saveButton"
            >
                Save Note
            </button>


            <div
                class="message"
                id="message"
            ></div>

        </div>



        <!-- SAVED NOTES -->

        <div class="card">

            <h2>
                Saved Notes
            </h2>


            <div
                class="notes-list"
                id="notesList"
            ></div>

        </div>


    </section>

</div>



<script>


// =========================================
// LOGIN CHECK
// =========================================

const studentData =
    localStorage.getItem("student");


if (!studentData) {

    window.location.href =
        "login.html";

}



// =========================================
// VARIABLES
// =========================================

let notes = [];

let editingIndex = -1;



// =========================================
// LOAD NOTES
// =========================================

function loadNotes() {

    const savedNotes =
        localStorage.getItem("placementNotes");


    if (savedNotes) {

        try {

            notes =
                JSON.parse(savedNotes);

        } catch (error) {

            notes = [];

        }

    } else {

        notes = [];

    }


    displayNotes();

}



// =========================================
// DISPLAY NOTES
// =========================================

function displayNotes() {

    const list =
        document.getElementById(
            "notesList"
        );


    list.innerHTML = "";


    if (notes.length === 0) {

        list.innerHTML = `
            <div class="empty">
                <div style="font-size:40px;">
                    📝
                </div>

                <p>
                    No notes yet.
                </p>

                <p>
                    Create your first note!
                </p>
            </div>
        `;

        return;

    }


    notes.forEach(
        function(note, index) {

            const noteElement =
                document.createElement(
                    "div"
                );


            noteElement.className =
                "note";


            noteElement.innerHTML = `

                <h3>
                    ${escapeHTML(note.title)}
                </h3>

                <div class="note-date">
                    ${escapeHTML(note.date)}
                </div>

                <p>
                    ${escapeHTML(note.content)}
                </p>

                <div class="note-actions">

                    <button
                        class="edit-btn"
                        onclick="editNote(${index})"
                    >
                        Edit
                    </button>

                    <button
                        class="delete-btn"
                        onclick="deleteNote(${index})"
                    >
                        Delete
                    </button>

                </div>

            `;


            list.appendChild(
                noteElement
            );

        }
    );

}



// =========================================
// SAVE NOTE
// =========================================

function saveNote() {


    const title =
        document.getElementById(
            "noteTitle"
        ).value.trim();


    const content =
        document.getElementById(
            "noteContent"
        ).value.trim();


    const message =
        document.getElementById(
            "message"
        );


    if (title === "") {

        message.textContent =
            "Please enter a note title.";

        message.style.color =
            "#dc2626";

        return;

    }


    if (content === "") {

        message.textContent =
            "Please write something in your note.";

        message.style.color =
            "#dc2626";

        return;

    }



    // =====================================
    // EDIT EXISTING NOTE
    // =====================================

    if (editingIndex !== -1) {

        notes[editingIndex].title =
            title;

        notes[editingIndex].content =
            content;

        notes[editingIndex].date =
            new Date().toLocaleString();


        editingIndex = -1;


        document.getElementById(
            "saveButton"
        ).textContent =
            "Save Note";


        message.textContent =
            "Note updated successfully!";


        message.style.color =
            "#16a34a";

    }



    // =====================================
    // CREATE NEW NOTE
    // =====================================

    else {

        const newNote = {

            title: title,

            content: content,

            date:
                new Date().toLocaleString()

        };


        notes.unshift(
            newNote
        );


        message.textContent =
            "Note saved successfully!";


        message.style.color =
            "#16a34a";

    }


    localStorage.setItem(
        "placementNotes",
        JSON.stringify(notes)
    );


    document.getElementById(
        "noteTitle"
    ).value = "";


    document.getElementById(
        "noteContent"
    ).value = "";


    displayNotes();

}



// =========================================
// EDIT NOTE
// =========================================

function editNote(index) {


    const note =
        notes[index];


    document.getElementById(
        "noteTitle"
    ).value =
        note.title;


    document.getElementById(
        "noteContent"
    ).value =
        note.content;


    editingIndex =
        index;


    document.getElementById(
        "saveButton"
    ).textContent =
        "Update Note";


    document.getElementById(
        "message"
    ).textContent =
        "Editing note...";


    document.getElementById(
        "message"
    ).style.color =
        "#2563eb";


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



// =========================================
// DELETE NOTE
// =========================================

function deleteNote(index) {


    const confirmDelete =
        confirm(
            "Are you sure you want to delete this note?"
        );


    if (!confirmDelete) {

        return;

    }


    notes.splice(
        index,
        1
    );


    localStorage.setItem(
        "placementNotes",
        JSON.stringify(notes)
    );


    displayNotes();

}



// =========================================
// HTML SAFETY
// =========================================

function escapeHTML(value) {

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}



// =========================================
// START
// =========================================

loadNotes();


</script>


</body>

</html>
